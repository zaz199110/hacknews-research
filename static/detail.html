<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - LLM 新闻日报</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- 返回按钮 -->
        <a href="/" class="back-link">← 返回搜索列表</a>
        
        <!-- 搜索信息 -->
        <div class="session-header">
            <h1 id="session-info" style="margin: 0; font-size: 1.25rem;">
                搜索结果
            </h1>
        </div>
        
        <!-- 导出区域 -->
        <div class="export-bar">
            <div class="export-bar-left">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="select-all" onchange="toggleSelectAll()">
                    <span>全选</span>
                </label>
                <span id="selected-count" style="color: #9B9A97; font-size: 13px;">已选 0 条</span>
            </div>
            <div class="export-bar-right">
                <button onclick="translateAll()" id="translate-btn" class="btn btn-primary">
                    翻译
                </button>
                <button onclick="showExportModal()" class="btn btn-primary">
                    导出 MD
                </button>
            </div>
        </div>
        
        <!-- 导出弹窗 -->
        <div id="export-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000;">
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 24px; border-radius: 8px; min-width: 400px;">
                <h3 style="margin: 0 0 16px 0;">导出 Markdown 文档</h3>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; color: #6B6B6B; margin-bottom: 8px;">文档名称</label>
                    <input type="text" id="export-name" placeholder="例如：2026-08-19 LLM 新闻日报" style="width: 100%;">
                </div>
                <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button onclick="closeExportModal()" class="btn btn-ghost">取消</button>
                    <button onclick="confirmExport()" class="btn btn-primary">导出</button>
                </div>
            </div>
        </div>
        
        <!-- 新闻列表 -->
        <div id="news-list">
            <!-- 新闻列表会在这里动态生成 -->
            <div class="empty-state">加载中...</div>
        </div>
    </div>
    
    <script src="/static/app.js"></script>
    <script>
        // 获取 URL 中的 session_id
        const pathParts = window.location.pathname.split('/');
        const sessionId = pathParts[pathParts.length - 1];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadSessionInfo();
            loadNewsList();
        });
    </script>
</body>
</html>
